<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>think-git-graph</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  #graph-container { position: relative; overflow: auto; max-height: calc(100vh - 200px); }
  #graph-canvas { display: block; cursor: pointer; }
  #commit-labels { position: absolute; top: 0; left: 0; pointer-events: none; }
  .commit-label { position: absolute; white-space: nowrap; pointer-events: auto; cursor: pointer; transition: background-color 0.15s ease; }
  .commit-label:hover { background-color: rgba(55, 65, 81, 0.5); }
  .commit-label:hover .commit-msg { color: #fbbf24; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  #refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased">
<div class="max-w-7xl mx-auto px-6 py-10">
  <header class="flex items-center justify-between mb-8 pb-4 border-b border-gray-800">
    <div class="flex items-center gap-4">
      <h1 class="text-2xl font-semibold tracking-tight text-gray-50">think-git-graph</h1>
      <span id="commit-count" class="text-xs text-gray-500 font-medium"></span>
    </div>
    <div class="flex items-center gap-4">
      <button id="refresh-btn" class="px-3 py-1.5 text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-md transition-colors duration-150 flex items-center gap-2 border border-gray-700 hover:border-gray-600" title="Refresh">
        <svg id="refresh-icon" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Refresh</span>
      </button>
      <div id="branch-indicator" class="flex items-center gap-2 text-sm text-gray-400">
        <span class="animate-pulse">Loading...</span>
      </div>
    </div>
  </header>

  <div id="graph-container" class="rounded-lg border border-gray-800 bg-gray-900/50 shadow-lg">
    <canvas id="graph-canvas"></canvas>
    <div id="commit-labels"></div>
  </div>

  <div id="load-more-container" class="text-center py-8 hidden">
    <button id="load-more-btn" class="px-5 py-2.5 text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-md transition-colors duration-150 border border-gray-700 hover:border-gray-600">
      Load More
    </button>
  </div>
</div>

<div id="detail-overlay" class="hidden fixed inset-0 z-50 flex justify-end">
  <div id="detail-backdrop" class="absolute inset-0 bg-black/50"></div>
  <div id="detail-panel" class="relative w-full max-w-lg bg-gray-900 border-l border-gray-700 overflow-y-auto shadow-2xl transform transition-transform duration-200 translate-x-full">
    <div class="sticky top-0 bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-100">Commit Detail</h2>
      <button id="detail-close" class="text-gray-400 hover:text-gray-200 text-xl leading-none">&times;</button>
    </div>
    <div id="detail-content" class="px-6 py-4">
      <p class="text-gray-500">Loading...</p>
    </div>
  </div>
</div>

<script>
const PER_PAGE = 200;
const ROW_HEIGHT = 48;
const GRAPH_LEFT = 24;
const LANE_WIDTH = 80;
const DOT_RADIUS = 13;
const LABEL_OFFSET = 28;
const BRANCH_HEADER_HEIGHT = 42;

let currentOffset = 0;
let totalCommits = 0;
let allCommits = [];
let branchColorMap = {};
let commitPositions = [];
let canvasHeight = 0;

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('graph-container');
const labelsContainer = document.getElementById('commit-labels');

function getBranchColor(branch) {
  if (!branchColorMap[branch]) {
    const idx = Object.keys(branchColorMap).length % 15;
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#84cc16','#14b8a6','#6366f1','#a855f7','#d946ef','#0ea5e9'];
    branchColorMap[branch] = colors[idx];
  }
  return branchColorMap[branch];
}

function assignLanes(commits, branches) {
  const branchLane = {};
  let nextLane = 0;

  // Pre-assign lanes to all known branches for consistency
  if (branches) {
    branches.forEach(b => {
      if (branchLane[b.name] === undefined) {
        branchLane[b.name] = nextLane++;
      }
      if (!branchColorMap[b.name] && b.color) {
        branchColorMap[b.name] = b.color;
      } else if (!branchColorMap[b.name]) {
        getBranchColor(b.name);
      }
    });
  }

  const commitLane = [];

  for (let i = 0; i < commits.length; i++) {
    const c = commits[i];
    let lane = -1;

    // Use known branch lane if commit is on a branch
    if (c.branches && c.branches.length > 0) {
      for (const b of c.branches) {
        if (branchLane[b] !== undefined) {
          lane = branchLane[b];
          break;
        }
      }
      if (lane === -1) {
        lane = nextLane++;
        branchLane[c.branches[0]] = lane;
      }
    }

    // Inherit from first parent if not on a known branch
    if (lane === -1 && c.parents && c.parents.length > 0) {
      for (let j = i - 1; j >= 0; j--) {
        if (commits[j].hash === c.parents[0]) {
          lane = commitLane[j];
          break;
        }
      }
    }

    if (lane === -1) lane = nextLane++;
    commitLane[i] = lane;
  }

  return { commitLane, laneCount: nextLane, branchLane };
}

function getBranchColorForLane(lane, commitLane, commitIdx) {
  for (let i = commitIdx; i >= 0; i--) {
    if (commitLane[i] === lane && allCommits[i].branches && allCommits[i].branches.length > 0) {
      return getBranchColor(allCommits[i].branches[0]);
    }
  }
  for (let i = commitIdx + 1; i < allCommits.length; i++) {
    if (commitLane[i] === lane && allCommits[i].branches && allCommits[i].branches.length > 0) {
      return getBranchColor(allCommits[i].branches[0]);
    }
  }
  return '#6b7280';
}

function findLaneForBranch(branch, commitLane, commits, upToIdx) {
  for (let i = upToIdx; i >= 0; i--) {
    if (commits[i].branches && commits[i].branches.includes(branch)) {
      return commitLane[i];
    }
  }
  return -1;
}

function drawArrowhead(x, y, angle, color) {
  const headLen = 7;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - headLen * Math.cos(angle - Math.PI / 6), y - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x - headLen * Math.cos(angle + Math.PI / 6), y - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function renderGraph(commits, branches, append) {
  if (!append) {
    allCommits = commits;
    commitPositions = [];
  } else {
    allCommits = allCommits.concat(commits);
  }

  const { commitLane, laneCount, branchLane } = assignLanes(allCommits, branches || []);

  // Build reverse mapping: lane -> branch name(s)
  const laneBranches = {};
  for (const [branch, lane] of Object.entries(branchLane)) {
    if (!laneBranches[lane]) laneBranches[lane] = [];
    laneBranches[lane].push(branch);
  }

  const graphWidth = GRAPH_LEFT + (laneCount * LANE_WIDTH) + 12;
  const labelAreaWidth = 520;
  const canvasWidth = Math.max(graphWidth + LABEL_OFFSET + labelAreaWidth, 900);

  canvas.width = canvasWidth;
  canvas.height = BRANCH_HEADER_HEIGHT + (allCommits.length * ROW_HEIGHT);
  canvasHeight = canvas.height;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw branch lane headers
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let l = 0; l < laneCount; l++) {
    const laneLeft = GRAPH_LEFT + (l * LANE_WIDTH);
    const laneCenter = laneLeft + (LANE_WIDTH / 2);
    const names = laneBranches[l] || [];
    const headerText = names.length > 0 ? names[0] : '';

    // Header background
    ctx.fillStyle = '#111827';
    ctx.fillRect(laneLeft, 0, LANE_WIDTH, BRANCH_HEADER_HEIGHT);

    // Branch color left border
    if (names.length > 0) {
      ctx.fillStyle = getBranchColor(names[0]);
      ctx.fillRect(laneLeft, 0, 3, BRANCH_HEADER_HEIGHT);
    }

    // Subtle separator between headers
    ctx.strokeStyle = '#374151';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(laneLeft + LANE_WIDTH, 0);
    ctx.lineTo(laneLeft + LANE_WIDTH, BRANCH_HEADER_HEIGHT);
    ctx.stroke();

    // Branch name (truncate if needed)
    ctx.fillStyle = '#d1d5db';
    ctx.font = 'bold 11px ui-sans-serif, system-ui, sans-serif';
    let displayText = headerText;
    if (displayText.length > 10) {
      displayText = displayText.substring(0, 9) + '...';
    }
    ctx.fillText(displayText, laneCenter, BRANCH_HEADER_HEIGHT / 2);
  }

  // Header bottom border
  ctx.strokeStyle = '#4b5563';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, BRANCH_HEADER_HEIGHT);
  ctx.lineTo(canvasWidth, BRANCH_HEADER_HEIGHT);
  ctx.stroke();

  // Draw persistent vertical lane lines
  ctx.strokeStyle = '#374151';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.25;

  for (let l = 0; l < laneCount; l++) {
    const laneX = GRAPH_LEFT + (l * LANE_WIDTH) + (LANE_WIDTH / 2);
    ctx.beginPath();
    ctx.moveTo(laneX, BRANCH_HEADER_HEIGHT);
    ctx.lineTo(laneX, canvasHeight);
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;

  // Compute commit positions
  for (let i = 0; i < allCommits.length; i++) {
    const lane = commitLane[i];
    const x = GRAPH_LEFT + (lane * LANE_WIDTH) + (LANE_WIDTH / 2);
    const y = BRANCH_HEADER_HEIGHT + (i * ROW_HEIGHT) + (ROW_HEIGHT / 2);
    commitPositions[i] = { x, y, hash: allCommits[i].hash, shortHash: allCommits[i].shortHash, lane };
  }

  // Draw connection lines with arrows
  for (let i = 0; i < allCommits.length; i++) {
    const c = allCommits[i];
    const pos = commitPositions[i];

    if (c.parents && c.parents.length > 0) {
      for (const parentHash of c.parents) {
        const parentIdx = allCommits.findIndex(p => p.hash === parentHash);
        if (parentIdx !== -1 && parentIdx > i) {
          const parentPos = commitPositions[parentIdx];
          const isMerge = c.parents.length > 1;
          const isCrossLane = pos.lane !== parentPos.lane;

          let color;
          if (isCrossLane) {
            color = isMerge ? getBranchColorForLane(pos.lane, commitLane, i) : getBranchColorForLane(parentPos.lane, commitLane, parentIdx);
          } else {
            color = getBranchColorForLane(pos.lane, commitLane, i);
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = isMerge ? 2.5 : 2;
          ctx.globalAlpha = isMerge ? 0.75 : 0.6;
          ctx.beginPath();

          if (isCrossLane) {
            // Curved merge/branch connection
            const startY = pos.y + DOT_RADIUS + 2;
            const endY = parentPos.y - DOT_RADIUS - 2;
            const midY = startY + (endY - startY) / 2;

            ctx.moveTo(pos.x, startY);
            ctx.bezierCurveTo(pos.x, midY, parentPos.x, midY, parentPos.x, endY);
            ctx.stroke();

            // Arrow at parent end - compute tangent of bezier at t=1
            // tangent ~ (P3 - P2) where P2=(parentPos.x, midY), P3=(parentPos.x, endY)
            const tangentAngle = Math.atan2(endY - midY, 0.001); // approx straight down or use dx=0
            drawArrowhead(parentPos.x, endY, Math.PI / 2, color);
          } else {
            // Straight vertical line within same lane
            const startY = pos.y + DOT_RADIUS + 2;
            const endY = parentPos.y - DOT_RADIUS - 2;
            ctx.moveTo(pos.x, startY);
            ctx.lineTo(parentPos.x, endY);
            ctx.stroke();

            // Arrow at parent end
            const angle = Math.atan2(endY - startY, parentPos.x - pos.x);
            drawArrowhead(parentPos.x, endY, angle, color);
          }

          ctx.globalAlpha = 1.0;
        }
      }
    }
  }

  // Draw commit nodes
  for (let i = 0; i < allCommits.length; i++) {
    const c = allCommits[i];
    const pos = commitPositions[i];

    let color = '#6b7280';
    if (c.branches && c.branches.length > 0) {
      color = getBranchColor(c.branches[0]);
    }

    // Outer glow for active commits
    if (c.branches && c.branches.length > 0) {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, DOT_RADIUS + 3, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.15;
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }

    // Main node circle
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, DOT_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Inner highlight for depth
    ctx.beginPath();
    ctx.arc(pos.x - 3, pos.y - 3, DOT_RADIUS / 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();

    // Secondary branch dots for commits on multiple branches
    if (c.branches && c.branches.length > 1) {
      for (let b = 1; b < c.branches.length; b++) {
        const bLane = findLaneForBranch(c.branches[b], commitLane, allCommits, i);
        if (bLane !== -1 && bLane !== pos.lane) {
          const bX = GRAPH_LEFT + (bLane * LANE_WIDTH) + (LANE_WIDTH / 2);
          ctx.beginPath();
          ctx.arc(bX, pos.y, DOT_RADIUS - 5, 0, Math.PI * 2);
          ctx.fillStyle = getBranchColor(c.branches[b]);
          ctx.globalAlpha = 0.8;
          ctx.fill();
          ctx.strokeStyle = '#111827';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }
      }
    }
  }

  // Render HTML commit labels
  labelsContainer.innerHTML = '';
  labelsContainer.style.width = canvasWidth + 'px';
  labelsContainer.style.height = canvasHeight + 'px';

  const labelLeft = GRAPH_LEFT + (laneCount * LANE_WIDTH) + LABEL_OFFSET;

  for (let i = 0; i < allCommits.length; i++) {
    const c = allCommits[i];
    const label = document.createElement('div');
    label.className = 'commit-label flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-800/50 transition-colors';
    label.style.left = labelLeft + 'px';
    label.style.top = (BRANCH_HEADER_HEIGHT + i * ROW_HEIGHT + 4) + 'px';
    label.style.height = (ROW_HEIGHT - 8) + 'px';
    label.style.minWidth = '320px';
    label.dataset.hash = c.hash;

    label.innerHTML =
      '<span class="font-mono text-xs text-amber-600 w-16 flex-shrink-0">' + escapeHtml(c.shortHash) + '</span>' +
      '<span class="commit-msg text-sm text-gray-300 flex-1 truncate transition-colors">' + escapeHtml(c.message) + '</span>' +
      '<span class="text-xs text-gray-600 w-20 flex-shrink-0 text-right hidden md:block">' + relativeDate(c.date) + '</span>';

    label.addEventListener('click', () => showCommitDetail(c.hash));
    labelsContainer.appendChild(label);
  }

  document.getElementById('load-more-container').classList.toggle('hidden', currentOffset + PER_PAGE >= totalCommits);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function relativeDate(dateStr) {
  const parts = dateStr.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  if (!parts) return dateStr;
  const date = new Date(+parts[1], +parts[2] - 1, +parts[3], +parts[4], +parts[5], +parts[6]);
  const now = new Date();
  const diffMs = now - date;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHr = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);

  if (diffSec < 60) return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  if (diffHr < 24) return diffHr + 'h ago';
  if (diffDay < 30) return diffDay + 'd ago';
  if (diffDay < 365) return Math.floor(diffDay / 30) + 'mo ago';
  return Math.floor(diffDay / 365) + 'y ago';
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  for (const pos of commitPositions) {
    const dx = mx - pos.x;
    const dy = my - pos.y;
    if (dx * dx + dy * dy <= (DOT_RADIUS + 6) * (DOT_RADIUS + 6)) {
      showCommitDetail(pos.hash);
      return;
    }
  }
});

async function loadMore() {
  const btn = document.getElementById('load-more-btn');
  btn.textContent = 'Loading...';
  btn.disabled = true;

  try {
    const newOffset = currentOffset + PER_PAGE;
    const resp = await fetch('/graph?limit=' + PER_PAGE + '&offset=' + newOffset);
    const data = await resp.json();
    if (data.branches) {
      data.branches.forEach(b => { if (b.color) branchColorMap[b.name] = b.color; });
    }
    currentOffset = newOffset;
    renderGraph(data.commits, data.branches, true);
  } catch (err) {
    btn.textContent = 'Error';
  } finally {
    btn.textContent = 'Load More';
    btn.disabled = false;
  }
}

async function loadGraph() {
  try {
    const resp = await fetch('/graph?limit=' + PER_PAGE + '&offset=0');
    const data = await resp.json();
    totalCommits = data.total;
    document.getElementById('commit-count').textContent = totalCommits + ' commits';
    branchColorMap = {};
    if (data.branches) {
      data.branches.forEach(b => { if (b.color) branchColorMap[b.name] = b.color; });
    }
    renderGraph(data.commits, data.branches, false);
  } catch (err) {
    document.getElementById('graph-container').innerHTML =
      '<p class="text-center py-20 text-red-400">Error loading commits.</p>';
  }
}

async function loadStatus() {
  try {
    const resp = await fetch('/status');
    const data = await resp.json();
    const branch = data.currentBranch || '(detached HEAD)';
    const statusDot = data.hasUncommitted
      ? '<span class="inline-block w-2 h-2 rounded-full bg-yellow-500 mr-1" title="Uncommitted changes"></span>'
      : '<span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1" title="Clean working tree"></span>';
    document.getElementById('branch-indicator').innerHTML =
      statusDot + '<span class="font-mono text-gray-200">' + branch + '</span>';
  } catch (err) {
    document.getElementById('branch-indicator').innerHTML =
      '<span class="text-red-400">Error loading status</span>';
  }
}

document.getElementById('load-more-btn').addEventListener('click', loadMore);
document.getElementById('refresh-btn').addEventListener('click', refresh);

async function refresh() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.classList.add('spin');

  try {
    currentOffset = 0;
    allCommits = [];
    branchColorMap = {};
    await Promise.all([loadGraph(), loadStatus()]);
  } finally {
    btn.disabled = false;
    icon.classList.remove('spin');
  }
}

loadStatus();
loadGraph();

function showCommitDetail(hash) {
  const overlay = document.getElementById('detail-overlay');
  const content = document.getElementById('detail-content');
  const panel = document.getElementById('detail-panel');

  overlay.classList.remove('hidden');
  panel.classList.remove('translate-x-full');
  panel.classList.add('translate-x-0');
  content.innerHTML = '<p class="text-gray-500">Loading...</p>';

  fetch('/commit/' + hash)
    .then(resp => resp.json())
    .then(data => {
      if (data.error) {
        content.innerHTML = '<p class="text-red-400">Error: ' + data.error + '</p>';
        return;
      }
      let html = '';
      html += '<div class="mb-4"><span class="text-xs text-gray-500 uppercase tracking-wider">Hash</span><p class="font-mono text-sm text-amber-500 break-all mt-1">' + data.hash + '</p></div>';
      html += '<div class="mb-4"><span class="text-xs text-gray-500 uppercase tracking-wider">Message</span><p class="text-sm text-gray-200 mt-1 whitespace-pre-wrap">' + data.message + '</p></div>';
      html += '<div class="mb-4"><span class="text-xs text-gray-500 uppercase tracking-wider">Author</span><p class="text-sm text-gray-200 mt-1">' + data.author + '</p></div>';
      html += '<div class="mb-4"><span class="text-xs text-gray-500 uppercase tracking-wider">Date</span><p class="text-sm text-gray-200 mt-1">' + data.date + '</p></div>';

      if (data.files && data.files.length > 0) {
        html += '<div class="mb-4"><span class="text-xs text-gray-500 uppercase tracking-wider">Files Changed (' + data.files.length + ')</span></div>';
        html += '<div class="border border-gray-800 rounded overflow-hidden">';
        data.files.forEach(f => {
          html += '<div class="flex items-center justify-between px-3 py-2 border-b border-gray-800 last:border-b-0 text-sm">';
          html += '<span class="text-gray-300 font-mono text-xs truncate mr-2">' + f.path + '</span>';
          html += '<span class="flex items-center gap-2 flex-shrink-0 text-xs">';
          if (f.additions > 0) html += '<span class="text-green-400">+' + f.additions + '</span>';
          if (f.deletions > 0) html += '<span class="text-red-400">-' + f.deletions + '</span>';
          if (f.additions === 0 && f.deletions === 0) html += '<span class="text-gray-500">Bin</span>';
          html += '</span></div>';
        });
        html += '</div>';
      } else {
        html += '<p class="text-sm text-gray-500">No files changed.</p>';
      }

      content.innerHTML = html;
    })
    .catch(err => {
      content.innerHTML = '<p class="text-red-400">Error loading commit detail.</p>';
    });
}

function hideCommitDetail() {
  const overlay = document.getElementById('detail-overlay');
  const panel = document.getElementById('detail-panel');

  panel.classList.remove('translate-x-0');
  panel.classList.add('translate-x-full');

  setTimeout(() => {
    overlay.classList.add('hidden');
  }, 200);
}

document.getElementById('detail-close').addEventListener('click', hideCommitDetail);
document.getElementById('detail-backdrop').addEventListener('click', hideCommitDetail);
</script>
</body>
</html>
