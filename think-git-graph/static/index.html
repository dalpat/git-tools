<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>think-git-graph</title>
<script>
(function() {
  var saved = localStorage.getItem('think-git-graph-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Theme-aware CSS variables */
  :root {
    --bg-body: #030712;
    --bg-card: #111827;
    --bg-card-gradient-start: rgba(17,24,39,0.8);
    --bg-card-gradient-end: rgba(17,24,39,0.5);
    --bg-hover: #1f2937;
    --bg-pill: #1f2937;
    --bg-pill-hover: #374151;
    --bg-badge: #1f2937;
    --bg-input: #1f2937;
    --bg-panel: rgba(17,24,39,0.95);
    --bg-backdrop: rgba(0,0,0,0.6);
    --bg-scrollbar-track: #111827;
    --bg-scrollbar-thumb: #374151;
    --bg-scrollbar-thumb-hover: #4b5563;
    --bg-commit-detail: rgba(31,41,55,0.5);
    --bg-commit-detail-hover: rgba(31,41,55,0.4);
    --bg-file-add: rgba(74,222,128,0.1);
    --bg-file-del: rgba(248,113,113,0.1);
    --text-primary: #f9fafb;
    --text-secondary: #e5e7eb;
    --text-muted: #9ca3af;
    --text-dim: #6b7280;
    --text-hash: #f59e0b;
    --border-color: #1f2937;
    --border-light: #374151;
    --border-detail: rgba(55,65,81,0.5);
    --shadow-color: rgba(0,0,0,0.3);
    --commit-label-hover-bg: rgba(55,65,81,0.6);
    --commit-msg-hover: #fbbf24;
    --branch-badge-bg: rgba(31,41,55,0.5);
    --tag-bg: #1f2937;
    --tag-border: rgba(245,158,11,0.3);
    --tag-text: #fbbf24;
    --status-dot-clean: #22c55e;
    --status-dot-dirty: #eab308;
    --ahead-text: #4ade80;
    --behind-text: #f87171;
    --remote-ahead-text: #60a5fa;
    --remote-behind-text: #fb923c;
    --error-text: #f87171;
    --graph-line-alpha: 0.5;
    --graph-merge-alpha: 0.75;
    --graph-dot-halo-alpha: 0.15;
    --graph-dot-center-alpha: 0.4;
    --graph-highlight-alpha: 0.3;
  }

  [data-theme="light"] {
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --bg-card-gradient-start: rgba(255,255,255,0.95);
    --bg-card-gradient-end: rgba(248,250,252,0.9);
    --bg-hover: #f1f5f9;
    --bg-pill: #e2e8f0;
    --bg-pill-hover: #cbd5e1;
    --bg-badge: #f1f5f9;
    --bg-input: #f1f5f9;
    --bg-panel: rgba(255,255,255,0.98);
    --bg-backdrop: rgba(15,23,42,0.4);
    --bg-scrollbar-track: #e2e8f0;
    --bg-scrollbar-thumb: #94a3b8;
    --bg-scrollbar-thumb-hover: #64748b;
    --bg-commit-detail: rgba(241,245,249,0.5);
    --bg-commit-detail-hover: rgba(241,245,249,0.4);
    --bg-file-add: rgba(34,197,94,0.1);
    --bg-file-del: rgba(239,68,68,0.1);
    --text-primary: #0f172a;
    --text-secondary: #1e293b;
    --text-muted: #475569;
    --text-dim: #94a3b8;
    --text-hash: #d97706;
    --border-color: #e2e8f0;
    --border-light: #cbd5e1;
    --border-detail: rgba(203,213,225,0.5);
    --shadow-color: rgba(15,23,42,0.08);
    --commit-label-hover-bg: rgba(226,232,240,0.6);
    --commit-msg-hover: #b45309;
    --branch-badge-bg: rgba(241,245,249,0.8);
    --tag-bg: #fef3c7;
    --tag-border: rgba(217,119,6,0.3);
    --tag-text: #b45309;
    --status-dot-clean: #16a34a;
    --status-dot-dirty: #ca8a04;
    --ahead-text: #16a34a;
    --behind-text: #dc2626;
    --remote-ahead-text: #2563eb;
    --remote-behind-text: #ea580c;
    --error-text: #dc2626;
    --graph-line-alpha: 0.4;
    --graph-merge-alpha: 0.65;
    --graph-dot-halo-alpha: 0.12;
    --graph-dot-center-alpha: 0.35;
    --graph-highlight-alpha: 0.25;
  }

  body {
    background-color: var(--bg-body);
    color: var(--text-primary);
  }

  #graph-container {
    position: relative;
    overflow-y: auto;
    max-height: calc(100vh - 180px);
    border-radius: 12px;
    background: linear-gradient(to bottom, var(--bg-card-gradient-start), var(--bg-card-gradient-end));
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 6px -1px var(--shadow-color);
  }

  #graph-canvas { display: block; cursor: pointer; }
  #commit-labels { position: absolute; top: 0; pointer-events: none; }
  .commit-label {
    position: absolute;
    white-space: nowrap;
    pointer-events: auto;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s ease;
  }
  .commit-label:hover {
    background-color: var(--commit-label-hover-bg);
    transform: translateX(2px);
  }
  .commit-label:hover .commit-msg {
    color: var(--commit-msg-hover);
  }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  #refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #load-more-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Custom scrollbar */
  #graph-container::-webkit-scrollbar { width: 8px; height: 8px; }
  #graph-container::-webkit-scrollbar-track { background: var(--bg-scrollbar-track); border-radius: 4px; }
  #graph-container::-webkit-scrollbar-thumb { background: var(--bg-scrollbar-thumb); border-radius: 4px; }
  #graph-container::-webkit-scrollbar-thumb:hover { background: var(--bg-scrollbar-thumb-hover); }

  /* Theme toggle button */
  #theme-toggle { transition: all 0.2s ease; }
  #theme-toggle:hover { transform: scale(1.1); }

  /* Detail panel theming */
  #detail-panel {
    background: var(--bg-panel);
    border-left-color: var(--border-light);
  }
  #detail-panel .sticky-header {
    background: var(--bg-panel);
    border-bottom-color: var(--border-color);
  }

  /* Load more button theming */
  #load-more-btn {
    background: var(--bg-pill);
    color: var(--text-muted);
    border-color: var(--border-light);
  }
  #load-more-btn:hover {
    background: var(--bg-pill-hover);
    border-color: var(--border-light);
  }

  /* Commit hash in detail panel */
  .commit-hash-box {
    background: var(--bg-commit-detail);
    border-color: var(--border-detail);
    color: var(--text-hash);
  }
  .commit-message-box {
    background: var(--bg-commit-detail);
    border-color: var(--border-color);
  }
  .file-list-container {
    background: var(--bg-commit-detail);
    border-color: var(--border-color);
  }
  .file-list-item:hover {
    background: var(--bg-commit-detail-hover);
  }
  .file-addition-bg {
    background: var(--bg-file-add);
    color: #16a34a;
  }
  .file-deletion-bg {
    background: var(--bg-file-del);
    color: #dc2626;
  }
  [data-theme="light"] .file-addition-bg { color: #15803d; }
  [data-theme="light"] .file-deletion-bg { color: #b91c1c; }

  /* Tag pills */
  .tag-pill {
    background: var(--tag-bg);
    color: var(--tag-text);
    border-color: var(--tag-border);
  }

  /* Status indicators */
  .status-clean { background: rgba(34,197,94,0.1); color: #22c55e; border-color: rgba(34,197,94,0.2); }
  .status-dirty { background: rgba(234,179,8,0.1); color: #eab308; border-color: rgba(234,179,8,0.2); }
  [data-theme="light"] .status-clean { background: rgba(22,163,74,0.1); color: #16a34a; border-color: rgba(22,163,74,0.2); }
  [data-theme="light"] .status-dirty { background: rgba(202,138,4,0.1); color: #ca8a04; border-color: rgba(202,138,4,0.2); }

  /* Branch indicator */
  .branch-badge {
    background: var(--bg-badge);
    border-color: var(--border-light);
  }
  .ahead-behind-badge {
    background: var(--branch-badge-bg);
    border-color: var(--border-detail);
  }
</style>
</head>

          <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />

      <button id="theme-toggle" class="p-2 rounded-lg transition-all duration-150" style="color: var(--text-muted);" title="Toggle theme">
        <svg id="theme-icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg id="theme-icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>

<div id="detail-overlay" class="hidden fixed inset-0 z-50 flex justify-end">

<script>
const PER_PAGE = 200;
const ROW_HEIGHT = 28;
const GRAPH_LEFT = 12;
const LANE_WIDTH = 18;
const DOT_RADIUS = 4;
const LABEL_OFFSET = 10;

let currentOffset = 0;
let totalCommits = 0;
let allCommits = [];
let allTags = [];
let branchColorMap = {};
let commitPositions = [];
let commitLaneMap = {};
let laneColors = [];
let canvasHeight = 0;
let currentBranch = '';

const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('graph-container');
const labelsContainer = document.getElementById('commit-labels');

const BRANCH_COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#84cc16','#14b8a6','#6366f1','#a855f7','#d946ef','#0ea5e9'];

function getTheme() {
  return document.documentElement.getAttribute('data-theme') || 'dark';
}

function isLight() {
  return getTheme() === 'light';
}

function getThemeColors() {
  const light = isLight();
  return {
    lineAlpha: light ? 0.4 : 0.5,
    mergeAlpha: light ? 0.65 : 0.75,
    dotHaloAlpha: light ? 0.12 : 0.15,
    dotCenterAlpha: light ? 0.35 : 0.4,
    highlightAlpha: light ? 0.25 : 0.3,
    labelHoverBg: light ? 'rgba(226,232,240,0.6)' : 'rgba(55,65,81,0.6)',
    hashColor: light ? '#d97706' : '#f59e0b',
    textPrimary: light ? '#0f172a' : '#f9fafb',
    textSecondary: light ? '#1e293b' : '#e5e7eb',
    textMuted: light ? '#475569' : '#9ca3af',
    textDim: light ? '#94a3b8' : '#6b7280',
    bgCard: light ? '#ffffff' : '#111827',
    bgPill: light ? '#e2e8f0' : '#1f2937',
    bgBadge: light ? '#f1f5f9' : '#1f2937',
    borderColor: light ? '#e2e8f0' : '#1f2937',
    tagBg: light ? '#fef3c7' : '#1f2937',
    tagBorder: light ? 'rgba(217,119,6,0.3)' : 'rgba(245,158,11,0.3)',
    tagText: light ? '#b45309' : '#fbbf24',
    errorText: light ? '#dc2626' : '#f87171'
  };
}

function getBranchColor(branch) {
  if (!branchColorMap[branch]) {
    const idx = Object.keys(branchColorMap).length % BRANCH_COLORS.length;
    branchColorMap[branch] = BRANCH_COLORS[idx];
  }
  return branchColorMap[branch];
}

function assignLanes(commits, branches, existingLaneMap, append) {
  const laneMap = {};
  const laneColorMap = {};
  let nextLane = 0;

  if (branches) {
    branches.forEach(b => {
      if (b.color && !branchColorMap[b.name]) {
        branchColorMap[b.name] = b.color;
      }
    });
  }

  const commitLane = [];

  for (let i = 0; i < commits.length; i++) {
    const c = commits[i];
    let lane;

    if (laneMap[c.hash] !== undefined) {
      lane = laneMap[c.hash];
    } else {
      const used = new Set(Object.values(laneMap));
      lane = 0;
      while (used.has(lane)) {
        lane++;
      }
      if (lane >= nextLane) {
        nextLane = lane + 1;
      }
    }

    commitLane[i] = lane;

    if (c.parents && c.parents.length > 0) {
      const firstParent = c.parents[0];
      if (laneMap[firstParent] === undefined) {
        laneMap[firstParent] = lane;
      }

      for (let p = 1; p < c.parents.length; p++) {
        const parentHash = c.parents[p];
        if (laneMap[parentHash] === undefined) {
          const used = new Set(Object.values(laneMap));
          let newLane = nextLane;
          while (used.has(newLane)) {
            newLane++;
          }
          laneMap[parentHash] = newLane;
          nextLane = newLane + 1;
        }
      }
    }
  }

  const laneCount = nextLane;

  for (let i = 0; i < commits.length; i++) {
    const lane = commitLane[i];
    const c = commits[i];

    if (laneColorMap[lane] === undefined) {
      if (c.branches && c.branches.length > 0) {
        laneColorMap[lane] = getBranchColor(c.branches[0]);
      } else {
        const colorIdx = lane % BRANCH_COLORS.length;
        laneColorMap[lane] = BRANCH_COLORS[colorIdx];
      }
    }
  }

  return { commitLane, laneCount, laneMap, laneColorMap };
}

function renderGraph(commits, branches, tags, append) {
  if (!append) {
    allCommits = commits;
    allTags = tags || [];
    commitPositions = [];
    commitLaneMap = {};
    laneColors = [];
  } else {
    allCommits = allCommits.concat(commits);
    allTags = tags || allTags;
  }

  document.getElementById('graph-loading').classList.add('hidden');
  canvas.classList.remove('hidden');
  labelsContainer.classList.remove('hidden');

  const commitTagsMap = {};
  for (const tag of allTags) {
    if (!commitTagsMap[tag.commitHash]) {
      commitTagsMap[tag.commitHash] = [];
    }
    commitTagsMap[tag.commitHash].push(tag.name);
  }

  for (const commit of allCommits) {
    commit.tags = commitTagsMap[commit.hash] || [];
  }

  const { commitLane, laneCount, laneMap, laneColorMap } = assignLanes(allCommits, branches || [], commitLaneMap, append);
  commitLaneMap = laneMap;
  laneColors = laneColorMap;

  const branchHeads = {};
  if (branches) {
    branches.forEach(b => {
      branchHeads[b.headHash] = b.name;
    });
  }

  const containerWidth = container.clientWidth || 1200;
  const labelWidth = Math.min(480, containerWidth * 0.45);
  const maxGraphWidth = containerWidth - labelWidth - 20;
  const actualLaneWidth = Math.min(LANE_WIDTH, Math.max(12, (maxGraphWidth - GRAPH_LEFT - 8) / Math.max(laneCount, 1)));
  const graphAreaWidth = GRAPH_LEFT + (laneCount * actualLaneWidth) + 8;
  const totalWidth = graphAreaWidth + labelWidth;

  container.style.minWidth = totalWidth + 'px';

  canvas.width = graphAreaWidth;
  canvas.height = allCommits.length * ROW_HEIGHT;
  canvasHeight = canvas.height;
  canvas.style.width = graphAreaWidth + 'px';
  canvas.style.height = canvasHeight + 'px';

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const t = getThemeColors();

  for (let i = 0; i < allCommits.length; i++) {
    const lane = commitLane[i];
    const x = GRAPH_LEFT + (lane * actualLaneWidth) + (actualLaneWidth / 2);
    const y = (i * ROW_HEIGHT) + (ROW_HEIGHT / 2);
    commitPositions[i] = { x, y, hash: allCommits[i].hash, shortHash: allCommits[i].shortHash, lane };
  }

  for (let i = 0; i < allCommits.length; i++) {
    const c = allCommits[i];
    const pos = commitPositions[i];

    if (c.parents && c.parents.length > 0) {
      for (let p = 0; p < c.parents.length; p++) {
        const parentHash = c.parents[p];
        const parentIdx = allCommits.findIndex(p => p.hash === parentHash);
        if (parentIdx !== -1 && parentIdx > i) {
          const parentPos = commitPositions[parentIdx];
          const isMerge = c.parents.length > 1;

          let color;
          if (p === 0) {
            color = laneColors[pos.lane] || '#9ca3af';
          } else {
            color = laneColors[parentPos.lane] || '#9ca3af';
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = isMerge ? 2 : 1.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalAlpha = isMerge ? t.mergeAlpha : t.lineAlpha;
          ctx.beginPath();

          const startY = pos.y + DOT_RADIUS + 1;
          const endY = parentPos.y - DOT_RADIUS - 1;
          const midY = startY + (endY - startY) / 2;

          ctx.moveTo(pos.x, startY);
          ctx.bezierCurveTo(pos.x, midY, parentPos.x, midY, parentPos.x, endY);

          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }
      }
    }
  }

  for (let i = 0; i < allCommits.length; i++) {
    const c = allCommits[i];
    const pos = commitPositions[i];

    const color = laneColors[pos.lane] || '#9ca3af';
    const isMerge = c.parents && c.parents.length > 1;

    ctx.beginPath();
    ctx.arc(pos.x, pos.y, DOT_RADIUS + 2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.globalAlpha = t.dotHaloAlpha;
    ctx.fill();
    ctx.globalAlpha = 1.0;

    if (isMerge) {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, DOT_RADIUS + 2.5, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = isLight() ? 0.5 : 0.6;
      ctx.stroke();
      ctx.globalAlpha = 1.0;

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, DOT_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, DOT_RADIUS - 1, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = t.dotCenterAlpha;
      ctx.fill();
      ctx.globalAlpha = 1.0;
    } else {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, DOT_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pos.x - 1, pos.y - 1, DOT_RADIUS / 2, 0, Math.PI * 2);
      ctx.fillStyle = isLight() ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.3)';
      ctx.fill();
    }
  }

  labelsContainer.innerHTML = '';
  labelsContainer.style.width = labelWidth + 'px';
  labelsContainer.style.height = canvasHeight + 'px';
  labelsContainer.style.left = graphAreaWidth + 'px';

  for (let i = 0; i < allCommits.length; i++) {
    const c = allCommits[i];
    const pos = commitPositions[i];
    const label = document.createElement('div');
    label.className = 'commit-label flex items-center gap-2 px-1.5 py-0.5 rounded transition-colors';
    label.style.left = '0px';
    label.style.top = (i * ROW_HEIGHT + 1) + 'px';
    label.style.height = (ROW_HEIGHT - 2) + 'px';
    label.style.maxWidth = (labelWidth - 8) + 'px';
    label.dataset.hash = c.hash;

    let labelPills = '';

    if (branchHeads[c.hash]) {
      const branchName = branchHeads[c.hash];
      const bColor = getBranchColor(branchName);
      labelPills += '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold mr-1.5 flex-shrink-0 shadow-sm" style="background-color: ' + bColor + '25; color: ' + bColor + '; border: 1px solid ' + bColor + '40;">' +
        '<span class="w-1.5 h-1.5 rounded-full mr-1.5" style="background-color: ' + bColor + ';"></span>' +
        escapeHtml(branchName) + '</span>';
    }

    if (c.tags && c.tags.length > 0) {
      c.tags.forEach(tag => {
        labelPills += '<span class="tag-pill inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-medium mr-1.5 flex-shrink-0 border">' +
          '<svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3v5h8l-3.5 3.5 3.5 3.5H7v5H5V3h2z"/></svg>' +
          escapeHtml(tag) + '</span>';
      });
    }

    const t = getThemeColors();
    label.innerHTML =
      labelPills +
      '<span class="font-mono text-[11px] w-14 flex-shrink-0 tracking-tight" style="color: ' + t.textDim + ';">' + escapeHtml(c.shortHash) + '</span>' +
      '<span class="commit-msg text-[13px] flex-1 truncate transition-colors ml-2" style="color: ' + t.textSecondary + ';">' + escapeHtml(c.message) + '</span>' +
      '<span class="text-[11px] w-16 flex-shrink-0 text-right hidden sm:block" style="color: ' + t.textDim + ';">' + relativeDate(c.date) + '</span>';

    label.addEventListener('click', () => showCommitDetail(c.hash));
    labelsContainer.appendChild(label);
  }

  document.getElementById('load-more-container').classList.toggle('hidden', currentOffset + PER_PAGE >= totalCommits);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function relativeDate(dateStr) {
  const parts = dateStr.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
  if (!parts) return dateStr;
  const date = new Date(+parts[1], +parts[2] - 1, +parts[3], +parts[4], +parts[5], +parts[6]);
  const now = new Date();
  const diffMs = now - date;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHr = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHr / 24);

  if (diffSec < 60) return 'just now';
  if (diffMin < 60) return diffMin + 'm ago';
  if (diffHr < 24) return diffHr + 'h ago';
  if (diffDay < 30) return diffDay + 'd ago';
  if (diffDay < 365) return Math.floor(diffDay / 30) + 'mo ago';
  return Math.floor(diffDay / 365) + 'y ago';
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  for (const pos of commitPositions) {
    const dx = mx - pos.x;
    const dy = my - pos.y;
    const hitRadius = Math.max(DOT_RADIUS + 4, 8);
    if (dx * dx + dy * dy <= hitRadius * hitRadius) {
      showCommitDetail(pos.hash);
      return;
    }
  }
});

async function loadMore() {
  const btn = document.getElementById('load-more-btn');
  const btnText = document.getElementById('load-more-text');
  btnText.textContent = 'Loading...';
  btn.disabled = true;

  try {
    const newOffset = currentOffset + PER_PAGE;
    const resp = await fetch('/graph?limit=' + PER_PAGE + '&offset=' + newOffset);
    const data = await resp.json();
    if (data.branches) {
      data.branches.forEach(b => { if (b.color) branchColorMap[b.name] = b.color; });
    }
    currentOffset = newOffset;
    renderGraph(data.commits, data.branches, data.tags, true);
  } catch (err) {
    btnText.textContent = 'Error';
  } finally {
    btnText.textContent = 'Load More';
    btn.disabled = false;
  }
}

async function loadGraph() {
  try {
    const resp = await fetch('/graph?limit=' + PER_PAGE + '&offset=0');
    const data = await resp.json();
    totalCommits = data.total;
    document.getElementById('commit-count').textContent = totalCommits + ' commits';

    const tagCountEl = document.getElementById('tag-count');
    if (data.tags && data.tags.length > 0) {
      tagCountEl.textContent = data.tags.length + ' tags';
      tagCountEl.classList.remove('hidden');
    } else {
      tagCountEl.classList.add('hidden');
    }

    branchColorMap = {};
    if (data.branches) {
      data.branches.forEach(b => { if (b.color) branchColorMap[b.name] = b.color; });
    }
    renderGraph(data.commits, data.branches, data.tags, false);
  } catch (err) {
    const t = getThemeColors();
    document.getElementById('graph-loading').innerHTML =
      '<div class="text-center py-10">' +
      '<p class="text-lg font-medium mb-2" style="color: ' + t.errorText + ';">Unable to load commits</p>' +
      '<p class="text-sm" style="color: ' + t.textMuted + ';">Make sure this is a git repository and that git is installed.</p>' +
      '</div>';
  }
}

async function loadStatus() {
  try {
    const resp = await fetch('/status');
    const data = await resp.json();
    currentBranch = data.currentBranch || '(detached HEAD)';
    const statusDot = data.hasUncommitted
      ? '<span class="status-dirty inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium border" title="Uncommitted changes"><span class="w-1.5 h-1.5 rounded-full" style="background: var(--status-dot-dirty);"></span>modified</span>'
      : '<span class="status-clean inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium border" title="Clean working tree"><span class="w-1.5 h-1.5 rounded-full" style="background: var(--status-dot-clean);"></span>clean</span>';

    let aheadBehindHtml = '';
    if (data.branchStatus) {
      const bs = data.branchStatus;
      const parts = [];

      if (bs.aheadOfMain > 0 || bs.behindMain > 0) {
        if (bs.aheadOfMain > 0) {
          parts.push('<span style="color: var(--ahead-text);" title="' + bs.aheadOfMain + ' commit(s) ahead of main">↑' + bs.aheadOfMain + '</span>');
        }
        if (bs.behindMain > 0) {
          parts.push('<span style="color: var(--behind-text);" title="' + bs.behindMain + ' commit(s) behind main">↓' + bs.behindMain + '</span>');
        }
      }

      if (bs.remoteTracking && bs.remoteTracking !== 'origin/main' && bs.remoteTracking !== 'origin/master') {
        if (bs.aheadOfRemote > 0 || bs.behindRemote > 0) {
          if (bs.aheadOfRemote > 0) {
            parts.push('<span class="text-[10px]" style="color: var(--remote-ahead-text);" title="' + bs.aheadOfRemote + ' commit(s) ahead of ' + bs.remoteTracking + '">↑' + bs.aheadOfRemote + '</span>');
          }
          if (bs.behindRemote > 0) {
            parts.push('<span class="text-[10px]" style="color: var(--remote-behind-text);" title="' + bs.behindRemote + ' commit(s) behind ' + bs.remoteTracking + '">↓' + bs.behindRemote + '</span>');
          }
        }
      }

      if (parts.length > 0) {
        aheadBehindHtml = '<span class="ahead-behind-badge flex items-center gap-1.5 text-xs font-mono px-1.5 py-0.5 rounded border">' + parts.join('') + '</span>';
      }
    }

    const t = getThemeColors();
    document.getElementById('branch-indicator').innerHTML =
      statusDot + '<span class="branch-badge font-mono text-xs px-2 py-0.5 rounded-md border" style="color: ' + t.textSecondary + ';">' + currentBranch + '</span>' + aheadBehindHtml;
  } catch (err) {
    const t = getThemeColors();
    document.getElementById('branch-indicator').innerHTML =
      '<span class="text-xs" style="color: ' + t.errorText + ';">Not a git repository</span>';
  }
}

/* Theme Toggle */
function initTheme() {
  const saved = localStorage.getItem('think-git-graph-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  setTheme(theme);
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('think-git-graph-theme', theme);
  updateThemeIcons(theme);
  // Re-render graph to update canvas colors
  if (allCommits.length > 0) {
    renderGraph(allCommits, null, allTags, false);
  }
}

function toggleTheme() {
  const current = getTheme();
  setTheme(current === 'dark' ? 'light' : 'dark');
}

function updateThemeIcons(theme) {
  document.getElementById('theme-icon-dark').classList.toggle('hidden', theme !== 'light');
  document.getElementById('theme-icon-light').classList.toggle('hidden', theme !== 'dark');
}

document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

document.getElementById('load-more-btn').addEventListener('click', loadMore);
document.getElementById('refresh-btn').addEventListener('click', refresh);

async function refresh() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  btn.disabled = true;
  icon.classList.add('spin');

  try {
    currentOffset = 0;
    allCommits = [];
    allTags = [];
    branchColorMap = {};
    commitLaneMap = {};
    laneColors = [];
    await Promise.all([loadGraph(), loadStatus()]);
  } finally {
    btn.disabled = false;
    icon.classList.remove('spin');
  }
}

initTheme();
loadStatus();
loadGraph();

function showCommitDetail(hash) {
  const overlay = document.getElementById('detail-overlay');
  const content = document.getElementById('detail-content');
  const panel = document.getElementById('detail-panel');
  const t = getThemeColors();

  overlay.classList.remove('hidden');
  panel.classList.remove('translate-x-full');
  panel.classList.add('translate-x-0');
  content.innerHTML = '<p style="color: ' + t.textMuted + ';">Loading...</p>';

  fetch('/commit/' + hash)
    .then(resp => resp.json())
    .then(data => {
      if (data.error) {
        content.innerHTML = '<p style="color: ' + t.errorText + ';">Error: ' + data.error + '</p>';
        return;
      }
      let html = '';
      html += '<div class="mb-5"><span class="text-[10px] font-semibold uppercase tracking-wider" style="color: ' + t.textDim + ';">Commit Hash</span><p class="commit-hash-box font-mono text-sm break-all mt-1.5 px-3 py-2 rounded-lg border">' + data.hash + '</p></div>';
      html += '<div class="mb-5"><span class="text-[10px] font-semibold uppercase tracking-wider" style="color: ' + t.textDim + ';">Message</span><p class="commit-message-box text-sm mt-1.5 whitespace-pre-wrap px-3 py-2 rounded-lg border" style="color: ' + t.textSecondary + ';">' + data.message + '</p></div>';
      html += '<div class="grid grid-cols-2 gap-4 mb-5">';
      html += '<div><span class="text-[10px] font-semibold uppercase tracking-wider" style="color: ' + t.textDim + ';">Author</span><p class="text-sm mt-1.5" style="color: ' + t.textSecondary + ';">' + data.author + '</p></div>';
      html += '<div><span class="text-[10px] font-semibold uppercase tracking-wider" style="color: ' + t.textDim + ';">Date</span><p class="text-sm mt-1.5" style="color: ' + t.textSecondary + ';">' + data.date + '</p></div>';
      html += '</div>';

      if (data.files && data.files.length > 0) {
        html += '<div class="mb-3"><span class="text-[10px] font-semibold uppercase tracking-wider" style="color: ' + t.textDim + ';">Files Changed</span><span class="ml-2 px-2 py-0.5 rounded-full text-xs" style="background: var(--bg-badge); color: ' + t.textMuted + ';">' + data.files.length + '</span></div>';
        html += '<div class="file-list-container rounded-lg overflow-hidden border">';
        data.files.forEach(f => {
          html += '<div class="file-list-item flex items-center justify-between px-4 py-2.5 border-b last:border-b-0 text-sm transition-colors" style="border-color: var(--border-color);">';
          html += '<span class="font-mono text-xs truncate mr-3" style="color: ' + t.textSecondary + ';">' + f.path + '</span>';
          html += '<span class="flex items-center gap-2 flex-shrink-0 text-xs font-medium">';
          if (f.additions > 0) html += '<span class="file-addition-bg px-1.5 py-0.5 rounded">+' + f.additions + '</span>';
          if (f.deletions > 0) html += '<span class="file-deletion-bg px-1.5 py-0.5 rounded">-' + f.deletions + '</span>';
          if (f.additions === 0 && f.deletions === 0) html += '<span style="color: ' + t.textDim + ';">Binary</span>';
          html += '</span></div>';
        });
        html += '</div>';
      } else {
        html += '<p class="text-sm" style="color: ' + t.textMuted + ';">No files changed.</p>';
      }

      content.innerHTML = html;
    })
    .catch(err => {
      content.innerHTML = '<p style="color: ' + t.errorText + ';">Error loading commit detail.</p>';
    });
}

function hideCommitDetail() {
  const overlay = document.getElementById('detail-overlay');
  const panel = document.getElementById('detail-panel');

  panel.classList.remove('translate-x-0');
  panel.classList.add('translate-x-full');

  setTimeout(() => {
    overlay.classList.add('hidden');
  }, 200);
}

document.getElementById('detail-close').addEventListener('click', hideCommitDetail);
document.getElementById('detail-backdrop').addEventListener('click', hideCommitDetail);

// Auto-refresh via Server-Sent Events
let eventSource = null;
let reconnectTimeout = null;
let reconnectAttempts = 0;
const MAX_RECONNECT_ATTEMPTS = 5;
const RECONNECT_DELAY_BASE = 1000;

function connectEventSource() {
  if (eventSource) {
    eventSource.close();
  }

  if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
    console.log('Auto-refresh: Max reconnection attempts reached');
    const indicator = document.getElementById('auto-refresh-indicator');
    indicator.classList.remove('hidden');
    indicator.classList.add('flex');
    indicator.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span><span>auto-off</span>';
    indicator.title = 'Auto-refresh disabled after connection failures';
    return;
  }

  eventSource = new EventSource('/events');

  eventSource.onopen = function() {
    reconnectAttempts = 0;
    document.getElementById('auto-refresh-indicator').classList.remove('hidden');
    document.getElementById('auto-refresh-indicator').classList.add('flex');
  };

  eventSource.onmessage = function(event) {
  };

  eventSource.addEventListener('connected', function(event) {
    console.log('Auto-refresh: Connected to server');
  });

  eventSource.addEventListener('refresh', function(event) {
    console.log('Auto-refresh: Git changes detected, refreshing...');
    refresh();
  });

  eventSource.onerror = function(error) {
    console.log('Auto-refresh: Connection error');
    document.getElementById('auto-refresh-indicator').classList.add('hidden');
    document.getElementById('auto-refresh-indicator').classList.remove('flex');

    if (eventSource.readyState === EventSource.CLOSED) {
      reconnectAttempts++;
      const delay = RECONNECT_DELAY_BASE * Math.pow(2, reconnectAttempts - 1);
      console.log('Auto-refresh: Reconnecting in ' + delay + 'ms (attempt ' + reconnectAttempts + '/' + MAX_RECONNECT_ATTEMPTS + ')');

      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
      }
      reconnectTimeout = setTimeout(connectEventSource, delay);
    }
  };
}

connectEventSource();

window.addEventListener('beforeunload', function() {
  if (eventSource) {
    eventSource.close();
  }
  if (reconnectTimeout) {
    clearTimeout(reconnectTimeout);
  }
});
</script>
